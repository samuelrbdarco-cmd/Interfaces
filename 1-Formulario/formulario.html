<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Formulario</h1>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre"><hr><hr>
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido"><hr><hr>
    <label for="sexo">Sexo:</label>
    <select id="sexo" name="sexo"><hr><hr>
        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
    </select><hr><hr>
    <label for="email">Email:</label>
    <input type="email" id="email"><hr><hr>
    <label for="nick">Nick:</label>
    <input type="text" id="nick"><hr><hr>
    <label for="comentario">Comentario:</label>
    <textarea id="comentario" name="comentario" rows="5" cols="50"></textarea><hr><hr>
    <input type="submit" value="Enviar">
    <input type="reset" value="Reset">
</body>
</html>
